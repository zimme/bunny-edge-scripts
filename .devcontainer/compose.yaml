name: bunny-edge-scripts

services:
  development:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      cache_from:
        - ${DEVCONTAINER_CACHE_FROM:-ghcr.io/zimme/bunny-edge-scripts-devcontainer:latest}
      args:
        DENO_VERSION: "2.9.3"
    command: sleep infinity
    entrypoint:
      - /usr/local/bin/development-entrypoint
    environment:
      DENO_DIR: /deno-dir
      DENO_NO_PROMPT: "1"
      DENO_NO_UPDATE_CHECK: "1"
    healthcheck:
      test:
        - CMD
        - test
        - -f
        - /tmp/bunny-edge-scripts-ready
      interval: 1s
      timeout: 2s
      retries: 120
    init: true
    volumes:
      - ..:/workspaces/bunny-edge-scripts:cached
