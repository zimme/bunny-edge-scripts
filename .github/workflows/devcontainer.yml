name: Dev Container

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - .devcontainer/**
      - .github/workflows/devcontainer.yml
      - .tool-versions
      - deno.json
      - deno.lock
      - packages/*/deno.json

permissions:
  contents: read
  packages: write

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prebuild:
    name: Build and publish
    if: github.repository == 'zimme/bunny-edge-scripts'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish development container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: ghcr.io/zimme/bunny-edge-scripts-devcontainer
          imageTag: latest,${{ github.sha }}
          push: always
