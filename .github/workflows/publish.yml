name: Publish Package

on:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: deno install

      - name: Verify package
        run: deno task ci

      - name: Publish bunny-ddns-edge to JSR
        run: deno publish --config packages/bunny-ddns-edge-script/deno.json

      - name: Publish generator to JSR
        run: deno publish --config packages/create-bunny-ddns/deno.json

      - name: Publish bunny-ddns-edge-script to npm
        run: npm publish --provenance --workspace @zimme/bunny-ddns-edge-script
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish generator to npm
        run: npm publish --provenance --workspace @zimme/create-bunny-ddns
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
