name: Copilot Setup Steps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare development container
        run: >-
          docker compose -f .devcontainer/compose.yaml
          up --build --detach --wait development
        env:
          CI: "true"

      - name: Validate agent configuration
        run: >-
          docker compose -f .devcontainer/compose.yaml
          exec -T --user vscode development deno task agents:check
        env:
          CI: "true"

      - name: Show development container logs
        if: failure()
        run: docker compose -f .devcontainer/compose.yaml logs development
